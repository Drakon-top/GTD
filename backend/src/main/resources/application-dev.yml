spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gtd_dev}?stringtype=unspecified
    username: ${DB_USERNAME:gtd_user}
    password: ${DB_PASSWORD:gtd_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true

logging:
  level:
    com.gtd.backend: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
