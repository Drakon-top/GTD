spring:
  application:
    name: gtd-backend

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:default-dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha}
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 2592000000

cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - Authorization
    - Content-Type
    - X-Requested-With
  allow-credentials: true
  max-age: 3600

rate-limit:
  max-requests: 100
  window-ms: 60000

rabbitmq:
  notification:
    exchange: notification.exchange
    dead-letter-exchange: notification.dlx
    reminder-queue: notification.reminder
    deadline-queue: notification.deadline
    recurrence-queue: notification.recurrence
    sync-conflict-queue: notification.sync_conflict
    dead-letter-queue: notification.dlq
    reminder-routing-key: notification.reminder
    deadline-routing-key: notification.deadline
    recurrence-routing-key: notification.recurrence
    sync-conflict-routing-key: notification.sync_conflict

scheduler:
  reminder-check-ms: 60000
  deadline-check-ms: 3600000
  recurrence-cron: "0 0 0 * * *"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
