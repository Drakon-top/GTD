services:
  postgres:
    image: postgres:16-alpine
    container_name: gtd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gtd_prod}
      POSTGRES_USER: ${DB_USERNAME:-gtd_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gtd_user} -d ${DB_NAME:-gtd_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: gtd-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-gtd_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - backend

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gtd-backend:latest
    container_name: gtd-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-gtd_prod}
      DB_USERNAME: ${DB_USERNAME:-gtd_user}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-gtd_rabbit}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_CREDENTIALS_FILE: /app/config/firebase-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - app_logs:/app/logs
      - ${FCM_CREDENTIALS_DIR:-./config}:/app/config:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: gtd-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-generated.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  certbot:
    image: certbot/certbot:latest
    container_name: gtd-certbot
    profiles:
      - ssl
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h; done'"
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  rabbitmq_data:
  app_logs:

networks:
  backend:
    driver: bridge
