server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'GTD App — waiting for SSL certificate. Run: scripts/init-ssl.sh\n';
        add_header Content-Type text/plain;
    }
}
